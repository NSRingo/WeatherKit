name: ' iRingo: 🌤 WeatherKit (Rewrite)'
description: iOS 18 & macOS 15 & watchOS 11\n1.解锁全部天气功能\n2.修改空气质量数据\n3.修改下一小时降水数据\n4.修改天气数据\n5.修改天气预警数据
open_url: http://boxjs.com/#/app/iRingo.WeatherKit
author: VirgilClyne[https://github.com/VirgilClyne],WordlessEcho[https://github.com/WordlessEcho],001[https://github.com/001ProMax],hhh2210[https://github.com/hhh2210]
homepage: https://NSRingo.github.io/guide/Weather/weather-kit
icon: https://developer.apple.com/assets/elements/icons/weatherkit/weatherkit-128x128.png
compat_arguments:
  endpoint: weatherkit.pages.dev
compat_arguments_desc: |-
  endpoint: [重写] 服务端点
      ├ weatherkit.pages.dev: 首选；直连；无需代理
      ├ dev.weatherkit.pages.dev: 开发版
      └ weather.nanocat.cloud: Worker 版；需要代理
rules:
- domain:
    match: weather-analytics-events.apple.com
    policy: REJECT
- domain_suffix:
    match: tthr.apple.com
    policy: REJECT
- domain:
    match: tether.edge.apple
    policy: REJECT
- and:
    match:
    - or:
        match:
        - asn:
            match: '714'
            no_resolve: true
        - asn:
            match: '6185'
            no_resolve: true
    - protocol:
        match: QUIC
    policy: REJECT-DROP
url_rewrites:
- match: ^https?:\/\/weatherkit\.apple\.com\/api\/v1\/availability\/
  location: https://{{{endpoint}}}/api/v1/availability/
  status_code: 307
- match: ^https?:\/\/weatherkit\.apple\.com\/api\/v2\/weather\/
  location: https://{{{endpoint}}}/api/v2/weather/
  status_code: 307
# 🌤 WeatherKit.api.v1.weatherAlerts.response
- match: ^https?:\/\/weatherkit\.apple\.com\/api\/v1\/weatherAlerts\?([^#]*&ids=[^&#]*-[0-9]{9}(?:&[^#]*)?)$
  location: https://{{{endpoint}}}/api/v1/weatherAlerts?$1
- match: ^https?:\/\/weatherkit\.apple\.com\/api\/v1\/weatherAlerts\?([^#]*&ids=-?[0-9]+(?:\.[0-9]+)?,-?[0-9]+(?:\.[0-9]+)?(?:&[^#]*)?)$
  location: https://{{{endpoint}}}/api/v1/weatherAlerts?$1
mitm:
  hostnames:
    includes:
    - weatherkit.apple.com
