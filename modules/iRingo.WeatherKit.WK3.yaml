# Egern local execution; configurable WK3 module
name: 'WeatherKit-Local-WK3'
description: 'Egern 本机处理：模块内调整参数；默认彩云美标、分钟降水、同源昨日对比、苹果原生预警'
author: meme
homepage: https://github.com/meme-lau/weatherkit-proxy
icon: https://developer.apple.com/assets/elements/icons/weatherkit/weatherkit-128x128.png
dns: {}
rules:
- and:
    match:
    - domain_suffix:
        match: weatherkit.apple.com
    - protocol:
        match: QUIC
    - dest_port:
        match: '443'
    policy: REJECT-NO-DROP
- and:
    match:
    - or:
        match:
        - ip_cidr:
            match: 139.178.128.0/18
            no_resolve: true
        - ip_cidr:
            match: 144.178.0.0/19
            no_resolve: true
        - ip_cidr:
            match: 144.178.36.0/22
            no_resolve: true
        - ip_cidr:
            match: 144.178.48.0/20
            no_resolve: true
        - ip_cidr:
            match: 17.0.0.0/8
            no_resolve: true
        - ip_cidr:
            match: 192.35.50.0/24
            no_resolve: true
        - ip_cidr:
            match: 198.183.17.0/24
            no_resolve: true
        - ip_cidr:
            match: 205.180.175.0/24
            no_resolve: true
        - ip_cidr6:
            match: 2403:300::/32
            no_resolve: true
        - ip_cidr6:
            match: 2620:149::/32
            no_resolve: true
        - ip_cidr6:
            match: 2a01:b740::/32
            no_resolve: true
        - ip_cidr:
            match: 63.92.224.0/19
            no_resolve: true
        - ip_cidr:
            match: 65.199.22.0/23
            no_resolve: true
    - protocol:
        match: UDP
    - dest_port:
        match: '443'
    policy: REJECT-NO-DROP
- and:
    match:
    - or:
        match:
        - asn:
            match: '714'
            no_resolve: true
        - asn:
            match: '6185'
            no_resolve: true
    - protocol:
        match: QUIC
    policy: REJECT-DROP
- domain_suffix:
    match: weatherkit.apple.com
    policy: DIRECT
- domain:
    match: weather-analytics-events.apple.com
    policy: REJECT-DROP
- domain_suffix:
    match: tthr.apple.com
    policy: REJECT-DROP
- domain:
    match: tether.edge.apple
    policy: REJECT-DROP
compat_arguments: {"DataSets":"airQuality,currentWeather,forecastDaily,forecastHourly,forecastNextHour,locationInfo,news,historicalComparisons,weatherAlerts,weatherChanges","Weather.Replace":"CN","Weather.Provider":"ColorfulClouds","Weather.ReplaceDaily":"false","Weather.ReplaceHourly":"false","WeatherAlerts.Provider":"QWeatherWeb","NextHour.Provider":"ColorfulClouds","AirQuality.Current.Index.Provider":"ColorfulCloudsUS","AirQuality.Current.Index.Replace":"HJ6332012","AirQuality.Current.Index.ForceCNPrimaryPollutants":"true","AirQuality.Current.Pollutants.Provider":"ColorfulClouds","AirQuality.Current.Pollutants.Units.Replace":"[]","AirQuality.Current.Pollutants.Units.Mode":"Scale","AirQuality.Comparison.ReplaceWhenCurrentChange":"true","AirQuality.Comparison.Yesterday.IndexProvider":"ColorfulCloudsUS","AirQuality.Comparison.Yesterday.PollutantsProvider":"ColorfulCloudsCN","AirQuality.Calculate.Algorithm":"WAQI_InstantCast_CN","AirQuality.Calculate.AllowOverRange":"true","API.ColorfulClouds.Token":"","API.QWeather.Host":"devapi.qweather.com","API.QWeather.Token":"","LogLevel":"INFO","HTTP_TIMEOUT_MS":"8000"}
compat_arguments_desc: "DataSets: [数据集] 解析与处理范围\n  默认 airQuality,currentWeather,forecastDaily,forecastHourly,forecastNextHour,locationInfo,news,historicalComparisons,weatherAlerts,weatherChanges；逗号分隔；填 [] 全部透传。WK3 实际支持空气质量、分钟降水与预警，其余保持苹果数据。\nWeather.Replace: [天气] 替换范围\n  默认 CN；逗号分隔国家码；保留现有大陆范围与香港缺失 AQ 专用补入逻辑，不支持正则。\nWeather.Provider: [天气] 数据源\n  默认 ColorfulClouds；WK2 天气数据源；WK3 当前/逐日/逐小时天气仍透传。\nWeather.ReplaceDaily: [天气] 替换逐日预报\n  默认 false；用于 WK2；WK3 逐日预报保持苹果数据。\nWeather.ReplaceHourly: [天气] 替换逐小时预报\n  默认 false；用于 WK2；WK3 逐小时预报保持苹果数据。\nWeatherAlerts.Provider: [天气预警] 数据源\n  默认 QWeatherWeb；QWeatherWeb：和风公开页面补全，苹果原生展示；WeatherKit：预警原样透传。原项目 API 预警源尚未移植，不提供无效选择。\nNextHour.Provider: [分钟降水] 数据源\n  默认 ColorfulClouds；WeatherKit 不替换；彩云/和风按已验证 WK3 雨况处理。\nAirQuality.Current.Index.Provider: [今日空气指数] 数据源\n  默认 ColorfulCloudsUS；默认彩云美标。WK3 已验证国标→美标和同标准指数替换；其他跨标准保留苹果数据。\nAirQuality.Current.Index.Replace: [今日空气指数] 替换范围（原始标准）\n  默认 HJ6332012；逗号分隔原始标准；不是输出标准。国内转美标仍填 HJ6332012。现有非国标算法会确保包含国内原标准。\nAirQuality.Current.Index.ForceCNPrimaryPollutants: [今日空气指数] 强制国标主要污染物\n  默认 true；沿用原项目：国标指数≤50时仍显示主要污染物。\nAirQuality.Current.Pollutants.Provider: [今日污染物] 数据源\n  默认 ColorfulClouds；用于 WK2/内置计算；WK3 美标直接替换时污染物跟随指数来源。\nAirQuality.Current.Pollutants.Units.Replace: [污染物单位] 替换原标准\n  默认 []；默认 [] 不额外转换；可填 HJ6332012、EPA_NowCast、EU.EAQI、UBA，逗号分隔。WK3 完整美标 AQ 使用同源单位，此独立设置主要用于 WK2。\nAirQuality.Current.Pollutants.Units.Mode: [污染物单位] 转换模式\n  默认 Scale；Scale 按标准；其余为原项目单位模式，适用范围同单位替换项。\nAirQuality.Comparison.ReplaceWhenCurrentChange: [昨日对比] 今日变化时重算\n  默认 true；WK2 沿用原设置；WK3 当前美标数据替换后始终仅做同源同标准比较，失败为未知。\nAirQuality.Comparison.Yesterday.IndexProvider: [昨日空气指数] 数据源\n  默认 ColorfulCloudsUS；默认彩云美标。WK3 不跨来源/算法比较；不兼容组合返回未知；WeatherKit 不注入。\nAirQuality.Comparison.Yesterday.PollutantsProvider: [昨日污染物] 数据源\n  默认 ColorfulCloudsCN；原项目内置昨日算法所用来源；WK3 裸 Calculate 昨日比较尚未接通。\nAirQuality.Calculate.Algorithm: [内置算法] 计算公式\n  默认 WAQI_InstantCast_CN；沿用当前默认（当前直接彩云美标时不使用此算法）。WK3 仅支持已验证的目标标准，其他目标透传。\nAirQuality.Calculate.AllowOverRange: [内置算法] 允许指数超标\n  默认 true；原项目计算开关；WK3 完整美标写入仍校验指数0–500。\nAPI.ColorfulClouds.Token: [API] 彩云令牌\n  默认 留空；留空沿用当前公共令牌；自有令牌只在设备参数中填写，不写入公开 Gist。\nAPI.QWeather.Host: [API] 和风主机\n  默认 devapi.qweather.com；使用和风 API 数据源时填写控制台主机名。\nAPI.QWeather.Token: [API] 和风令牌\n  默认 留空；使用和风 API 数据源时需要；网页预警补全不需要。\nLogLevel: [调试] 日志等级\n  默认 INFO；默认 INFO，与当前脚本一致；只控制本机日志。\nHTTP_TIMEOUT_MS: [网络] 单次请求超时（毫秒）\n  默认 8000；默认8000毫秒；脚本总体超时仍为30秒。"
