lace":{"name":"[污染物单位] 替换原标准","description":"默认 [] 不额外转换；可填 HJ6332012、EPA_NowCast、EU.EAQI、UBA，逗号分隔。WK3 完整美标 AQ 使用同源单位，此独立设置主要用于 WK2。","default_value":"[]"},"AirQuality.Current.Pollutants.Units.Mode":{"name":"[污染物单位] 转换模式","description":"Scale 按标准；其余为原项目单位模式，适用范围同单位替换项。","default_value":"Scale","options":["Scale","ugm3","EU_ppb","US_ppb","Force_ugm3","Force_EU_ppb","Force_US_ppb"]},"AirQuality.Comparison.ReplaceWhenCurrentChange":{"name":"[昨日对比] 今日变化时重算","description":"WK2 沿用原设置；WK3 当前美标数据替换后始终仅做同源同标准比较，失败为未知。","default_value":"true","options":["true","false"]},"AirQuality.Comparison.Yesterday.IndexProvider":{"name":"[昨日空气指数] 数据源","description":"默认彩云美标。WK3 不跨来源/算法比较；不兼容组合返回未知；WeatherKit 不注入。","default_value":"ColorfulCloudsUS","options":["ColorfulCloudsUS","ColorfulCloudsCN","QWeather","Calculate","WeatherKit"]},"AirQuality.Comparison.Yesterday.PollutantsProvider":{"name":"[昨日污染物] 数据源","description":"原项目内置昨日算法所用来源；WK3 裸 Calculate 昨日比较尚未接通。","default_value":"ColorfulCloudsCN","options":["ColorfulCloudsCN","QWeather"]},"AirQuality.Calculate.Algorithm":{"name":"[内置算法] 计算公式","description":"沿用当前默认（当前直接彩云美标时不使用此算法）。WK3 仅支持已验证的目标标准，其他目标透传。","default_value":"WAQI_InstantCast_CN","options":["None","WAQI_InstantCast_CN","WAQI_InstantCast_CN_25_DRAFT","WAQI_InstantCast_US","EU_EAQI","UBA"]},"AirQuality.Calculate.AllowOverRange":{"name":"[内置算法] 允许指数超标","description":"原项目计算开关；WK3 完整美标写入仍校验指数0–500。","default_value":"true","options":["true","false"]},"API.ColorfulClouds.Token":{"name":"[API] 彩云令牌","description":"留空沿用当前公共令牌；自有令牌只在设备参数中填写，不写入公开 Gist。","default_value":""},"API.QWeather.Host":{"name":"[API] 和风主机","description":"使用和风 API 数据源时填写控制台主机名。","default_value":"devapi.qweather.com"},"API.QWeather.Token":{"name":"[API] 和风令牌","description":"使用和风 API 数据源时需要；网页预警补全不需要。","default_value":""},"LogLevel":{"name":"[调试] 日志等级","description":"默认 INFO，与当前脚本一致；只控制本机日志。","default_value":"INFO","options":["OFF","ERROR","WARN","INFO","DEBUG","ALL"]},"HTTP_TIMEOUT_MS":{"name":"[网络] 单次请求超时（毫秒）","description":"默认8000毫秒；脚本总体超时仍为30秒。","default_value":"8000"}}
