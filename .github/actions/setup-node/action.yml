name: Setup Node and Dependencies
description: Install Node.js and project dependencies

inputs:
  package-token:
    description: Token used for the configured npm registries
    required: false

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "26"
        cache: npm
    - name: Install Dependencies
      run: npm ci
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.package-token }}
        PUPPETEER_SKIP_DOWNLOAD: "true"
