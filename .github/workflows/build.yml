name: Build
on:
  workflow_call:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@main
        with:
          node-version: 'latest'
          cache: 'npm'
      # https://github.com/puppeteer/puppeteer/issues/13595#issuecomment-2640309385
      # https://github.com/puppeteer/puppeteer/blob/cdfbde6247fbe286c31a91ac62ffed6f2f801ee4/.github/workflows/ci.yml#L140
      - name: Disable AppArmor
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Install dependencies
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
      - name: Install Puppeteer Chrome
        run: |
          node node_modules/puppeteer/install.mjs
          node --input-type=module -e 'import puppeteer from "puppeteer"; console.log(puppeteer.executablePath())'
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
      - name: Update local package.json version from release tag
        if: github.ref_type == 'tag'
        uses: BellCubeDev/update-package-version-by-release-tag@v2
        with:
          version: ${{ github.ref_name }}
          keep-v: "false" # If set to "true", will not remove any 'v' prefix from the version number.
          ignore-semver-check: "false" # If set to "true", will not check if the version number is a valid semver version.
      - name: Build scripts
        run: npm run build
      - name: Generate modules
        run: npm run build:args
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
      - name: Build WK3 scripts and tagged modules
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            npm run build:wk3 -- --version "${GITHUB_REF_NAME#v}"
          else
            npm run build:wk3
          fi
      - name: Verify Egern and WK3 artifacts
        run: |
          test -s dist/iRingo.WeatherKit.yaml
          for platform in egern surge loon stash quantumultx; do
            for stage in request response; do test -s "dist/wk3-$platform-$stage.bundle.js"; done
          done
          if [ "${{ github.ref_type }}" = tag ]; then
            for extension in yaml sgmodule lpx stoverride snippet; do
              test -s "dist/iRingo.WeatherKit.WK3.$extension"
            done
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@master
        with:
          name: artifact
          path: |
            CHANGELOG.md
            rulesets
            dist
